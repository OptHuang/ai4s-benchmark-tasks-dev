name: static-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Proposal checks
        run: |
          mapfile -t proposals < <(find proposals -name '*.md' \
            ! -name TEMPLATE.md ! -name README.md -print | sort)
          if ((${#proposals[@]})); then
            python3 scripts/check_proposal.py "${proposals[@]}"
          fi
      - name: Validator regression tests
        run: |
          for test in scripts/test_*.sh; do
            bash "$test"
          done
      - name: Formal task checks
        run: |
          while IFS= read -r task_file; do
            bash scripts/run_task_checks.sh "$(dirname "$task_file")"
          done < <(find tasks -name task.toml -print | sort)
      - name: Reference task regression checks
        run: |
          while IFS= read -r task_file; do
            bash scripts/run_task_checks.sh --reference "$(dirname "$task_file")"
          done < <(find reference-tasks -name task.toml -print | sort)
      - name: Rubric/template consistency
        run: |
          python3 ci_checks/check-rubric-consistency.py \
            task-template.toml rubrics/task-implementation.toml
