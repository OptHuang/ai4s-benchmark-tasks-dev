name: validate-task-oracle-nop

on:
  pull_request:
    paths:
      - "tasks/**"
      - "reference-tasks/**"
      - "task-template.toml"
      - "ci_checks/**"
      - "scripts/validate_task.sh"
      - "scripts/run_task_checks.sh"
      - "scripts/resolve_changed_tasks.py"
      - ".github/workflows/validate-task.yml"
  workflow_dispatch:
    inputs:
      task_path:
        description: "Repo-relative task or reference-task path"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-task-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned Harbor
        run: uv tool install --force "harbor==0.24.0"
      - name: Resolve task paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PATH: ${{ inputs.task_path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            printf '%s\n' "${INPUT_PATH%/}" > /tmp/task-paths
          else
            python3 scripts/resolve_changed_tasks.py --base "$BASE_SHA" --head "$HEAD_SHA" > /tmp/task-paths
          fi
          cat /tmp/task-paths
      - name: Static, oracle and nop validation
        env:
          AI4S_VALIDATION_OUT: ${{ runner.temp }}/ai4s-validation
        run: |
          mapfile -t tasks < /tmp/task-paths
          if ((${#tasks[@]} == 0)); then
            echo "No task changes to validate." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## Oracle / nop validation" >> "$GITHUB_STEP_SUMMARY"
          failed=()
          for task in "${tasks[@]}"; do
            gpus=$(python3 -c 'import sys, tomllib; print(int(tomllib.load(open(sys.argv[1], "rb")).get("environment", {}).get("gpus") or 0))' "$task/task.toml")
            if ((gpus > 0)); then
              echo "::warning::$task requests $gpus GPU(s); the GitHub runner has none, so it needs manual validation"
              echo "- \`$task\`: skipped, requests $gpus GPU(s) and needs manual validation" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            mode=()
            if [[ "$task" == reference-tasks/* ]]; then
              mode=(--reference)
            fi
            if bash scripts/run_task_checks.sh "${mode[@]}" "$task" < /dev/null \
              && bash scripts/validate_task.sh "$task" < /dev/null; then
              echo "- \`$task\`: passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- \`$task\`: **failed**" >> "$GITHUB_STEP_SUMMARY"
              failed+=("$task")
            fi
          done
          if ((${#failed[@]})); then
            printf '::error::validation failed for %s\n' "${failed[@]}"
            exit 1
          fi
      - name: Upload Harbor runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai4s-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/ai4s-validation
          if-no-files-found: ignore
          retention-days: 30
